<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Infiniware Chess - True Python</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #121216; color: #d4a843; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #canvas { border: 2px solid #d4a843; box-shadow: 0 0 30px rgba(0,0,0,0.5); width: 1280px; height: 800px; }
        #status { margin-top: 10px; font-size: 14px; }
        #progress-container { width: 400px; height: 10px; background: #1e1e26; border: 1px solid #d4a843; margin-top: 20px; }
        #progress-bar { width: 0%; height: 100%; background: #d4a843; transition: width 0.3s; }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="status">Initializing Python 3.12 Engine...</div>

    <script type="text/javascript">
        // Fixed Loader Logic
        window.SDL = {
            canvas: document.getElementById('canvas')
        };
        
        const status = document.getElementById('status');
        const bar = document.getElementById('progress-bar');

        function setStatus(msg) {
            status.innerText = msg;
            console.log("[Pygame] " + msg);
        }

        function setProgress(p) {
            bar.style.width = p + "%";
        }

        // Hook into the loader
        window.Module = {
            canvas: window.SDL.canvas,
            setStatus: setStatus,
            monitorRunDependencies: (left) => {
                if (left > 0) setStatus("Downloading dependencies (" + left + " remaining)...");
                else setStatus("Ready! Launching Game...");
            }
        };

        // Standard pygbag configuration
        var config = {
            xterm: false,
            pwa: false,
            u_wait: 0,
            archive: "chess_game",
            entrypoint: "main.py",
            mountid: "canvas",
            cdn: "https://pygame-web.github.io/cdn/0.9.3/"
        };
    </script>
    <!-- Use the specific, non-broken version of the runtime -->
    <script src="https://pygame-web.github.io/cdn/0.9.3/pythons.js" async defer></script>
</body>
</html>
