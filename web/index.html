<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game - Web Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Board Section (Left) -->
        <div class="board-container">
            <div id="board" class="chess-board"></div>
        </div>

        <!-- Panel Section (Right) -->
        <aside class="sidebar">
            <h1>INFINIWARE <span>CHESS</span></h1>

            <div class="clocks">
                <div class="clock-box">
                    <span class="player-label">BLACK</span>
                    <div class="clock" id="black-clock">10:00</div>
                </div>
                <div class="clock-box">
                    <span class="player-label">WHITE</span>
                    <div class="clock" id="white-clock">10:00</div>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">GLOBAL RANKING</div>
                <div id="leaderboard-list"></div>
            </div>

            <div class="panel-section" style="flex: 1; display: flex; flex-direction: column;">
                <div class="panel-title">MOVE HISTORY</div>
                <div class="move-history-scroll" id="history-list"></div>
            </div>

            <div class="action-buttons">
                <button onclick="undoMove()">UNDO</button>
                <button onclick="resign()">RESIGN</button>
                <button onclick="newGame()">NEW GAME</button>
                <button onclick="showAuth()">ACCOUNT</button>
            </div>
        </aside>

        <div id="status-msg">Welcome to the Grandmaster's Board</div>
        <div id="thinking-indicator" style="position: absolute; bottom: 55px; left: 740px; font-family: 'HelveticaMedium'; font-size: 18px; color: rgb(212, 168, 67); display: none;">
            AI thinking...
        </div>
    </div>

    <!-- Modals -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="auth-title">LOGIN</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="active" onclick="handleAuth()">SUBMIT</button>
            <p onclick="toggleAuthMode()" id="auth-toggle" style="margin-top: 15px; cursor: pointer; color: var(--gold); font-family: 'HelveticaMedium';">New? Register here</p>
            <button style="margin-top: 10px; border: none; background: transparent;" onclick="hideAuth()">CANCEL</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
