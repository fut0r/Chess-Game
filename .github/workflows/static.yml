name: Build True Python Web

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pygbag
        run: pip install pygbag

      - name: Build Game Assets
        run: |
          # Create the heavy Wasm assets
          python3 -m pygbag --build .
          
      - name: Fix Loader Bugs
        run: |
          # Replace the buggy pygbag loader with our custom Master Loader
          cp index.html build/web/index.html
          # Copy the security bypass script
          cp coi-serviceworker.js build/web/coi-serviceworker.js
          # Copy CNAME to build folder
          echo "chess.infiniware.bid" > build/web/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
